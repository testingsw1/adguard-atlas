# Reference deployment of AdGuard Atlas.
#
#   docker compose up -d            then open http://<host>:8080
#
# The app has no login of its own: publish the port on a trusted network only, or
# put it behind a reverse proxy that authenticates.

services:
  adguard-atlas:
    image: ghcr.io/marska/adguard-atlas:latest
    # Built from this checkout when the image is not present locally.
    # Remove this line to always use the published image.
    build: .
    container_name: adguard-atlas
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # To try the image first, set DEMO=true and drop everything else below.
      # DEMO: "true"

      ADGUARD_1_URL: "http://192.168.1.2:3000"
      ADGUARD_1_USER: "atlas"
      ADGUARD_1_PASSWORD_FILE: /run/secrets/adguard_1_password
      # ADGUARD_1_NAME: "primary"
      # ADGUARD_1_INSECURE_TLS: "true"     # self-signed https panel

      # A second resolver, if you run one:
      # ADGUARD_2_URL: "http://192.168.1.3:3000"
      # ADGUARD_2_USER: "atlas"
      # ADGUARD_2_PASSWORD_FILE: /run/secrets/adguard_2_password

      # Where the arcs start. Never derived from your public IP.
      HOME_LAT: "52.23"
      HOME_LON: "21.01"
      # HOME_LABEL: "Home"

      # Which layout the page opens in: MAP or STATS. Omit it for STATS.
      # VIEW: "MAP"
      # VIEW: "STATS"

      # --- the archive ---------------------------------------------------
      ATLAS_DB: "/data/atlas.db"
      # 0 keeps every query forever; set a number of days to prune old rows.
      # KEEP_DAYS: "0"
      # Import the whole existing query log on first start (true by default).
      # BACKFILL: "true"
      # BACKFILL_MAX_PAGES: "0"          # 0 = until AdGuard Home's log ends
      # BACKFILL_PAUSE_MS: "250"

      # Live traffic kept in RAM for the arcs only. Counters never use it.
      LIVE_BUFFER_MINUTES: "5"

      # POLL_INTERVAL_MS: "2000"
      # PRIVACY_MODE: "true"
      # IGNORE_CLIENTS: "192.168.1.9,nas"
      # IGNORE_DOMAINS: "lan,example.org"
    secrets:
      - adguard_1_password

    # The only writable path. Create it on the host first and give it to uid 10001:
    #   mkdir -p ./data && sudo chown -R 10001:10001 ./data
    volumes:
      - ./data:/data
    # To use your own MaxMind GeoLite2-City database instead of the bundled DB-IP one:
    #   - ./GeoLite2-City.mmdb:/data/GeoLite2-City.mmdb:ro
    # and add to environment:  GEOIP_DB: /data/GeoLite2-City.mmdb

    # Hardening. The root filesystem stays read-only; /data is the single exception,
    # because a permanent archive needs somewhere permanent to live.
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    user: "10001:10001"
    pids_limit: 128
    mem_limit: 512m
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/healthz').then(r=>r.json()).then(h=>{if(!h.db||h.db.queries<0)process.exit(1);process.exit(0)},()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

secrets:
  adguard_1_password:
    # A file containing only the password. Keep it out of version control;
    # it must be readable by uid 10001 (chmod 644, or chown 10001).
    file: ./secrets/adguard_1_password
